# This is a basic workflow to help you get started with Actions

name: Comunicador de la legión de la justicia

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      villano:
        description: 'que villano envia el mensaje?'
        required: true
        type: choice
        options:
          - "Lex Luthor"
          - "Joker"
          - "Darkseid"
          - "Brainiac"
          - "Deathstroke"
          - "Black Manta"
          - "Sinestro"
          - "Cheetah"
          - "Bane"
          - "Ra's al Ghul"

      mensaje:
        description: 'Mensaje para el consejo de la justicia'
        required: true
        default: 'la mision ha sido cumplida'

      prioridad:
        description: 'que prioridad tiene el mensaje?'
        required: true
        type: choice
        options:
            - "alta"
            - "media"
            - "baja"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  trasmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cowsay

      - name: Transmitiendo mensaje
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              📡  COMUNICADO DE LA LEGIÓN  📡               ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🦹  %-54s║\n" "Villano:   ${{ github.event.inputs.villano }}"
          printf "║  💬  %-54s║\n" "Mensaje:   ${{ github.event.inputs.mensaje }}"
          printf "║  🚨  %-54s║\n" "Prioridad: ${{ github.event.inputs.prioridad }}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║          ✅  Mensaje transmitido al consejo  ✅             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          cowsay -f tux "Villano: ${{ github.event.inputs.villano }}\nMensaje: ${{ github.event.inputs.mensaje }}\nPrioridad: ${{ github.event.inputs.prioridad }}"
          echo ""
          echo "fecha y hora de transmisión: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

